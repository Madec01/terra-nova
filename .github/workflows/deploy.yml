# Publication du jeu sur GitHub Pages.
#
# GitHub Pages sert les fichiers du dépôt TELS QUELS. Or `src/main.js` importe
# `three` par son nom de paquet : un navigateur ne sait pas résoudre un tel
# import, le module ne s'exécute jamais et le jeu reste bloqué sur son écran
# d'amorçage. Il faut donc publier le résultat de `vite build`, pas les sources.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les tests unitaires
        run: npm test

      - name: Construire le jeu
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
