<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="description" content="TERRA NOVA — transformez une planète hostile en monde habitable.">
<title>TERRA NOVA</title>
<!-- main.css importe panels.css : une seule feuille suffit. -->
<link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <canvas id="viewport" aria-label="Planète — glisser pour tourner, molette pour zoomer, clic pour sélectionner une région"></canvas>
  <div id="ui" class="ui-root"></div>

  <noscript>
    <div class="fatal">TERRA NOVA nécessite JavaScript.</div>
  </noscript>

  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-title">TERRA NOVA</div>
      <div class="boot-sub">Initialisation du système orbital…</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <!--
    Table d'imports : elle permet au NAVIGATEUR de résoudre `import ... from
    'three'` tout seul, sans outil de build. C'est ce qui rend le code source
    directement jouable quand il est servi tel quel — par exemple par GitHub
    Pages. La bibliothèque est versionnée dans le dépôt (vendor/) plutôt que
    tirée d'un CDN : le jeu fonctionne ainsi hors ligne et ne dépend de
    personne. Quand le jeu est construit avec Vite, cette table devient
    simplement inutile : le bundle n'importe plus rien par nom de paquet.
  -->
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <script type="module" src="./src/main.js"></script>

  <script>
    /* Filet de sécurité : si le module principal ne s'exécute pas (fichiers
       servis sans build, import non résolu, WebGL absent), le jeu restait
       indéfiniment sur « Initialisation du système orbital… » sans rien dire.
       Un écran figé n'est pas un message d'erreur : on explique. */
    (function () {
      var diagnostic = null;
      window.addEventListener('error', function (e) {
        var m = (e && (e.message || (e.target && e.target.src))) || '';
        if (/Failed to resolve module|Failed to fetch dynamically imported|MIME type/i.test(String(m))) {
          diagnostic = 'Les fichiers source sont servis sans avoir été construits.';
        }
      }, true);

      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || window.TERRA) return;          // le jeu a démarré : rien à faire
        boot.innerHTML =
          '<div class="boot-inner">' +
          '<div class="boot-title">TERRA NOVA</div>' +
          '<div class="boot-sub" style="max-width:34em;line-height:1.6">' +
          '<strong>Le jeu n\u2019a pas pu d\u00e9marrer.</strong><br><br>' +
          (diagnostic ? diagnostic + '<br><br>' : '') +
          'TERRA NOVA doit \u00eatre <em>construit</em> avant d\u2019\u00eatre publi\u00e9 : ' +
          'le code source utilise des imports de paquets qu\u2019un navigateur ne sait pas ' +
          'r\u00e9soudre seul.<br><br>' +
          'En local : <code>npm install</code> puis <code>npm run dev</code>.<br>' +
          'Sur GitHub Pages : r\u00e9glez la source sur <em>GitHub Actions</em> ' +
          '(Settings \u2192 Pages), le d\u00e9p\u00f4t contient d\u00e9j\u00e0 le workflow.<br><br>' +
          'D\u00e9tail technique dans la console du navigateur.' +
          '</div></div>';
      }, 12000);
    })();
  </script>
</body>
</html>
